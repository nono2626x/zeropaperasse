<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ZéroPaperasse</title>
<meta name="description" content="Devis, factures, relances et sauvegardes — sans y penser.">
<meta name="theme-color" content="#f97316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paperasse">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <rect x="5" y="2.5" width="14" height="19" rx="2.5" stroke="currentColor" stroke-width="2"/>
          <path d="M9 8h6M9 12h6M9 16h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <strong>ZéroPaperasse</strong>
    </div>
    <span id="bizname"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav id="tabbar">
    <button class="tab on" data-v="accueil" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3.5 10.5 12 3.5l8.5 7v9a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Accueil</span>
    </button>
    <button class="tab" data-v="clients" aria-label="Clients">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 20c.6-3.4 2.8-5 5.5-5s4.9 1.6 5.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 5.6M17.8 15.4c1.6.8 2.5 2.3 2.7 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Clients</span>
    </button>
    <button class="tab big" data-v="documents" aria-label="Documents">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7.5L19 8v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5A1.5 1.5 0 0 1 6.5 3.5H7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14.5 3.5V8H19M8.5 13h7M8.5 16.5h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Documents</span>
    </button>
    <button class="tab" data-v="relances" aria-label="Relances">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v10.5H10L5.5 20v-4H4V5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 12.2h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Relances</span>
    </button>
    <button class="tab" data-v="reglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9M18.5 18.5l-1.9-1.9M7.4 7.4 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Réglages</span>
    </button>
  </nav>
</div>

<div id="sheet-root" hidden>
  <div id="sheet-backdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true">
    <div id="sheet-handle"></div>
    <div id="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" aria-label="Fermer">✕</button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="store.js"></script>
<script src="pdf.js"></script>
<script src="facturepdf.js"></script>
<script src="relances.js"></script>
<script src="app.js"></script>
</body>
</html>
